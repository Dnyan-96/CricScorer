<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Offline cricket scorecard and live scoring app"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>LocalCricket</title>
</head>
<body>
<header class="topbar"><div class="brand"><span class="ball">LC</span><div><strong>LocalCricket</strong><small>Score every moment</small></div></div><span id="offlineTag" class="tag">OFFLINE READY</span></header>
<nav class="tabs"><button data-tab="dashboard" class="active">Home</button><button data-tab="teams">Teams</button><button data-tab="players">Players</button><button data-tab="history">History</button><button data-tab="backup">Backup</button></nav>
<main id="app" class="wrap"><div class="loading">Loading LocalCricket…</div></main>
<div id="toast" class="toast" role="status"></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div id="modalContent"></div><div class="modal-actions"><button class="btn secondary" value="cancel">Cancel</button><button class="btn primary" id="modalSave" value="default">Save</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
