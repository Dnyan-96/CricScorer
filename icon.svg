<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e3424"/>
      <stop offset="100%" stop-color="#06140e"/>
    </radialGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#0b5e38"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Scoreboard Gridlines -->
  <g opacity="0.18" stroke="#00e676" stroke-width="2.5">
    <line x1="80" y1="130" x2="432" y2="130"/>
    <line x1="80" y1="210" x2="432" y2="210"/>
    <line x1="80" y1="290" x2="432" y2="290"/>
    <line x1="80" y1="370" x2="432" y2="370"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="372" y1="80" x2="372" y2="432"/>
  </g>

  <!-- Cricket Stumps & Bails -->
  <g fill="#d9f36a" opacity="0.85">
    <rect x="226" y="160" width="12" height="180" rx="3"/>
    <rect x="250" y="160" width="12" height="180" rx="3"/>
    <rect x="274" y="160" width="12" height="180" rx="3"/>
    <rect x="216" y="152" width="80" height="8" rx="2"/>
  </g>

  <!-- Glowing Cricket Ball -->
  <circle cx="256" cy="256" r="135" fill="url(#ballGrad)" filter="drop-shadow(0 0 25px rgba(0,230,118,0.45))"/>

  <!-- Ball Seam -->
  <path d="M160 160 C 220 220, 292 292, 352 352" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M150 170 C 210 230, 282 302, 342 362" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="8 8" fill="none"/>
  <path d="M170 150 C 230 210, 302 282, 362 342" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="8 8" fill="none"/>
</svg>
